# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: apim-rate-limit-foundry
metadata:
  template: apim-rate-limit-foundry@1.0.0
infra:
  provider: terraform
  path: infra
hooks:
  preprovision:
    shell: sh
    run: ./infra/scripts/preflight.sh
    interactive: false
services:
  api:
    project: .
    language: python
    host: function
    resourceName: ${AZURE_FUNCTION_NAME}
    hooks:
      prepackage:
        shell: sh
        run: ./infra/scripts/package-function.sh
        interactive: false
  stream:
    project: ./stream
    language: python
    host: function
    resourceName: ${AZURE_STREAM_FUNCTION_NAME}
    hooks:
      prepackage:
        shell: sh
        run: ../infra/scripts/package-stream.sh
        interactive: false
  web:
    project: ./web
    language: js
    host: appservice
    resourceName: ${AZURE_WEB_NAME}
    dist: ../infra/.artifacts/web
    hooks:
      prepackage:
        shell: sh
        run: ../infra/scripts/package-web.sh
        interactive: false
