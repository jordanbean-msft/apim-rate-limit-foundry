<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title description"><title id="title">Cache composition and throttling origin</title><desc id="description">Actual settled disjoint tokens: 19687 uncached input, 23296 cache reads, 1806 output. Physical APIM responses: 49 custom 429s and 25 gateway/native or missing decision.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="1200" height="510" fill="#f3f6fb"/><text x="28" y="42" font-size="26" fill="#17324d">Cache composition and throttling origin</text><text x="28" y="72" font-size="15" fill="#17324d">Live Azure query results - independently plotted, not an Azure portal screenshot</text><text x="28" y="96" font-size="14" fill="#17324d">Review window: 2026-11-05 19:32 to 2026-11-06 19:32 UTC | Illustrative catalog, not an invoice</text><rect x="24" y="118" width="558" height="342" rx="12" fill="white" stroke="#d7e1ef"/><text x="44" y="153" font-size="21" fill="#17324d">Actual settled token categories</text><text x="44" y="180" font-size="14" fill="#17324d">Disjoint categories; cache reads are already in total input.</text><text x="44" y="213" font-size="15" fill="#17324d">Uncached input</text><rect x="44" y="225" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="44" y="225" width="287.430" height="26" rx="3" fill="#0067b8"/><text x="419" y="245" font-size="15" fill="#17324d">19,687</text><text x="44" y="279" font-size="15" fill="#17324d">Cache reads</text><rect x="44" y="291" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="44" y="291" width="340.122" height="26" rx="3" fill="#087f8c"/><text x="419" y="311" font-size="15" fill="#17324d">23,296</text><text x="44" y="345" font-size="15" fill="#17324d">Output</text><rect x="44" y="357" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="44" y="357" width="26.368" height="26" rx="3" fill="#6950a1"/><text x="419" y="377" font-size="15" fill="#17324d">1,806</text><text x="44" y="427" font-size="13" fill="#17324d">Scale: 0 to 25,000 tokens. Cache writes: 0 observed.</text><rect x="606" y="118" width="558" height="342" rx="12" fill="white" stroke="#d7e1ef"/><text x="626" y="153" font-size="21" fill="#17324d">APIM 429 origin</text><text x="626" y="180" font-size="14" fill="#17324d">Physical gateway responses, not budget reservations.</text><text x="626" y="222" font-size="15" fill="#17324d">Custom limiter</text><rect x="626" y="234" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="626" y="234" width="357.700" height="26" rx="3" fill="#bd2544"/><text x="1001" y="254" font-size="15" fill="#17324d">49</text><text x="626" y="312" font-size="15" fill="#17324d">Gateway/native OR missing custom decision</text><rect x="626" y="324" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="626" y="324" width="182.500" height="26" rx="3" fill="#b87900"/><text x="1001" y="344" font-size="15" fill="#17324d">25</text><text x="626" y="417" font-size="13" fill="#17324d">Scale: 0 to 50 responses. Missing is not proof of native.</text><text x="28" y="490" font-size="14" fill="#17324d">43 of 49 custom denials predate caller attribution; top-caller charts contain 6 denials from one observed caller.</text></g></svg>
