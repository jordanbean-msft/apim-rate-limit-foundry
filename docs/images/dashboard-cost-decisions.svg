<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title description"><title id="title">Cost and admission decisions</title><desc id="description">Known effective USD by service split into actual and conservative liability; 99 allowed and 49 denied unique reservations.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="1200" height="510" fill="#f3f6fb"/><text x="28" y="42" font-size="26" fill="#17324d">Cost and admission decisions</text><text x="28" y="72" font-size="15" fill="#17324d">Live Azure query results - independently plotted, not an Azure portal screenshot</text><text x="28" y="96" font-size="14" fill="#17324d">Review window: 2026-11-05 19:32 to 2026-11-06 19:32 UTC | Illustrative catalog, not an invoice</text><rect x="24" y="118" width="558" height="342" rx="12" fill="white" stroke="#d7e1ef"/><text x="44" y="153" font-size="21" fill="#17324d">Known effective cost by service (USD)</text><text x="44" y="180" font-size="14" fill="#17324d">Actual replaces the hold; it is not added to it.</text><text x="44" y="216" font-size="15" fill="#17324d">Foundry</text><rect x="44" y="228" width="365" height="24" rx="3" fill="#eef2f8"/><rect x="44" y="228" width="118.603" height="24" fill="#0067b8"/><rect x="162.603" y="228" width="215.322" height="24" fill="#b87900"/><text x="420" y="246" font-size="16" fill="#17324d">$0.164675</text><text x="44" y="280" font-size="15" fill="#17324d">Document Intelligence</text><rect x="44" y="292" width="365" height="24" rx="3" fill="#eef2f8"/><rect x="44" y="292" width="141.944" height="24" fill="#0067b8"/><rect x="185.944" y="292" width="40.556" height="24" fill="#b87900"/><text x="420" y="310" font-size="16" fill="#17324d">$0.090000</text><text x="44" y="344" font-size="15" fill="#17324d">AI Language</text><rect x="44" y="356" width="365" height="24" rx="3" fill="#eef2f8"/><rect x="44" y="356" width="34.472" height="24" fill="#0067b8"/><rect x="78.472" y="356" width="0.000" height="24" fill="#b87900"/><text x="420" y="374" font-size="16" fill="#17324d">$0.017000</text><text x="44" y="427" font-size="13" fill="#17324d">Blue: actual | Amber: conservative | Scale: $0 to $0.18</text><rect x="606" y="118" width="558" height="342" rx="12" fill="white" stroke="#d7e1ef"/><text x="626" y="153" font-size="21" fill="#17324d">Custom admission decisions</text><text x="626" y="180" font-size="14" fill="#17324d">One reservation per decision after retry deduplication.</text><text x="626" y="222" font-size="15" fill="#17324d">Allowed</text><rect x="626" y="234" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="626" y="234" width="361.350" height="26" rx="3" fill="#087f8c"/><text x="1001" y="254" font-size="15" fill="#17324d">99</text><text x="626" y="312" font-size="15" fill="#17324d">Denied</text><rect x="626" y="324" width="365" height="26" rx="3" fill="#eef2f8"/><rect x="626" y="324" width="178.850" height="26" rx="3" fill="#bd2544"/><text x="1001" y="344" font-size="15" fill="#17324d">49</text><text x="626" y="417" font-size="13" fill="#17324d">Scale: 0 to 100 reservations. Denials debit zero.</text><text x="28" y="490" font-size="14" fill="#17324d">Cost sums known observations only: two legacy admissions lack effective cost. Use the durable ledger for authoritative reporting.</text></g></svg>
