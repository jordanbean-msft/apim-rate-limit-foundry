[project]
name = "apim-rate-limit-foundry"
version = "0.1.0"
description = "Redis-first AI gateway budgets with best-effort usage persistence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "azure-functions",
  "azure-identity",
  "azure-data-tables",
  "redis>=6",
  "aiohttp",
  "azure-monitor-opentelemetry>=1.8.12",
  "azurefunctions-extensions-http-fastapi>=1.0.1",
  "azure-monitor-query>=2.0.0",
  "azure-eventhub>=5.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "httpx",
  "ruff",
  "mypy",
  "pre-commit",
]

[project.scripts]
apim-rate-limit-foundry = "apim_rate_limit_foundry.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apim_rate_limit_foundry"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "scripts/tests", "apim/tests", "demo/tests"]

[tool.coverage.run]
include = [
  "src/apim_rate_limit_foundry/*",
  "function_app.py",
  "stream/function_app.py",
]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv]
package = true
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apim_rate_limit_foundry"]
