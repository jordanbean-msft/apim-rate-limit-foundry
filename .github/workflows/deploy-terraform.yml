name: Deploy Terraform

on:
  workflow_dispatch:
    inputs:
      azd_env_name:
        description: Configured deployment environment
        type: environment
        required: true
      azure_cloud:
        description: Target Azure cloud
        type: choice
        options: [AzureCloud, AzureUSGovernment]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    environment: ${{ inputs.azd_env_name }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLOUD: ${{ inputs.azure_cloud }}
      AZURE_ENV_NAME: ${{ inputs.azd_env_name }}
      AZD_ENV_JSON: ${{ vars.AZD_ENV_JSON }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.9
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.azure_cloud }}
      - name: Configure cloud and authenticate with OIDC
        shell: bash
        run: |
          az cloud set --name "$AZURE_CLOUD"
          azd config set cloud.name "$AZURE_CLOUD"
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Restore explicit azd configuration
        run: uv run --locked python scripts/configure_ci.py
      - name: Provision infrastructure
        run: azd provision --environment "$AZURE_ENV_NAME" --no-prompt
