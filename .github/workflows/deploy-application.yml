name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      azd_env_name:
        description: Configured deployment environment
        type: environment
        required: true
      azure_cloud:
        description: Target Azure cloud
        type: choice
        options: [AzureCloud, AzureUSGovernment]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.azd_env_name }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLOUD: ${{ inputs.azure_cloud }}
      AZURE_ENV_NAME: ${{ inputs.azd_env_name }}
      AZD_ENV_JSON: ${{ vars.AZD_ENV_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.azure_cloud }}
      - name: Configure cloud and authenticate with OIDC
        shell: bash
        run: |
          az cloud set --name "$AZURE_CLOUD"
          azd config set cloud.name "$AZURE_CLOUD"
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Restore explicit azd configuration
        run: uv run --locked python scripts/configure_ci.py
      - name: Deploy configured services
        run: azd deploy --environment "$AZURE_ENV_NAME" --no-prompt
