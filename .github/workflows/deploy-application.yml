name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      azd_env_name:
        description: Configured deployment environment
        type: environment
        required: true
      azure_cloud:
        description: Target Azure cloud
        type: choice
        options: [AzureCloud, AzureUSGovernment]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.azd_env_name }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLOUD: ${{ inputs.azure_cloud }}
      AZURE_ENV_NAME: ${{ inputs.azd_env_name }}
      AZD_ENV_JSON: ${{ vars.AZD_ENV_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.azure_cloud }}
      - name: Configure cloud and authenticate with OIDC
        shell: bash
        run: |
          az cloud set --name "$AZURE_CLOUD"
          azd config set cloud.name "$AZURE_CLOUD"
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Restore explicit azd configuration
        run: uv run python scripts/configure_ci.py
      - name: Deploy configured services
        run: azd deploy --environment "$AZURE_ENV_NAME" --no-prompt
